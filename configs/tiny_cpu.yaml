# Tiny CPU end-to-end smoke config. Generate the fixtures first:
#   python scripts/make_tiny_fixtures.py
# then run: moss-lora-train --config configs/tiny_cpu.yaml
model:
  path: runs/tiny_model
  revision: null
  dtype: fp32
  local_files_only: true
data:
  cache_dir: runs/tiny_cache
  num_workers: 0
  batch_size: 2
  drop_last: false
  pin_memory: false
train:
  device: cpu
  output_dir: runs/tiny_run
  max_steps: 4
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]
  warmup_steps: 1
  lr_scheduler: cosine
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true
  compile: false
  compile_mode: default
  sdpa_backend: auto
  ema_decay: 0.9
  timestep_sampling: logit_normal
  logit_normal_mean: -1.09
  logit_normal_std: 0.95
  sigma_cutoff: 0.95
  uniform_mix: 0.01
lora:
  rank: 4
  alpha: 4
  dropout: 0.0
  targets: [q, k, v, o, ffn_up_gate, ffn_down]
  text_projection: false
logging:
  log_every: 1
  save_every: 2
  sample_every: 2
  sample_steps: 2
  sample_cfg: 3.0
  sample_skip_layer: -1
  sample_negative_prompt: ""
  sample_val_ids: [item_00000, item_00001]
