# clean30 v4 (NSFW-recaptioned) 5 epochs, rank 64, 1M pixels, batch 3.
# 20,953 cached images, batch 3 with drop_last -> 6,980 steps/epoch, 34,900 steps total.
# Checkpoints: every 3,000 steps, keep last 5 + every epoch-end (weights + optimizer).
model:
  path: models/MOSS-Image-Base
  dtype: bf16
  local_files_only: true
data:
  cache_dir: cache/clean30_v4_1m
  num_workers: 4
  batch_size: 3
  drop_last: true
  pin_memory: true
train:
  device: cuda
  output_dir: runs/clean30_v4_5ep_r64
  max_steps: 34900
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]
  warmup_steps: 200
  lr_scheduler: cosine
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true
  batched_forward: false  # verified on 5090: per-sample + compile is fastest at 1M (8.15 vs 8.75 s/step bs8) and saves 5GiB
  selective_checkpointing: "off"
  compile: true
  compile_mode: default  # max-autotune re-tunes per concrete shape: autotune storm on varying buckets
  sdpa_backend: auto
  ema_decay: 0.0
  timestep_sampling: logit_normal
  logit_normal_mean: -0.40
  logit_normal_std: 0.95
  sigma_cutoff: 0.95
  uniform_mix: 0.01
  keep_last_checkpoints: 5
  save_epoch: true
lora:
  rank: 64
  alpha: 64
  dropout: 0.0
  targets: [q, k, v, o, ffn_up_gate, ffn_down]
  text_projection: false
  final_linear: false
logging:
  log_every: 20
  save_every: 3000
  sample_every: 3000
  sample_steps: 30
  sample_cfg: 3.0
  sample_skip_layer: 22
  sample_negative_prompt: "nsfw, worst quality, bad anatomy, watermark, jpeg artifact"
  sample_val_ids: [item_00000, item_03000, item_06000, item_09000,
                   item_12000, item_15000, item_18000, item_20000]
  comfy_export: true
  comfy_export_checkpoints: false
