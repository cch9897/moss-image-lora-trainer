# cleanV2 extension: 2 more epochs after cleanV2_4ep_r64_bs8 (total 6 epochs).
# Resume from runs/cleanV2_4ep_r64_bs8/checkpoints/step_012284 (epoch 4 boundary).
# steps/epoch = sum(items_per_bucket // 8) = 3071
# max_steps = 3071 * 6 = 18426 (two extra epochs = 6142 steps)
# warmup is 0 on purpose: the resumed run continues an already-warmed schedule.
# LR at resume (step 12284 / 18426) = 1.5e-4 * 0.25 = 3.75e-5; reaches 0 at 18426.
model:
  path: models/MOSS-Image-Base
  dtype: bf16
  local_files_only: true
data:
  cache_dir: cache/cleanV2_1m
  num_workers: 4
  batch_size: 8
  drop_last: true
  pin_memory: true
train:
  device: cuda
  output_dir: runs/cleanV2_ext2ep_r64_bs8
  max_steps: 18426
  gradient_accumulation_steps: 1
  learning_rate: 1.5e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]
  warmup_steps: 0
  lr_scheduler: cosine
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true
  batched_forward: false  # verified on 5090: per-sample + compile is fastest at 1M (8.15 vs 8.75 s/step bs8) and saves 5GiB
  selective_checkpointing: "off"
  compile: true
  compile_mode: max-autotune-no-cudagraphs
  sdpa_backend: auto
  ema_decay: 0.0
  timestep_sampling: logit_normal
  logit_normal_mean: -0.40
  logit_normal_std: 0.95
  sigma_cutoff: 0.95
  uniform_mix: 0.01
  keep_last_checkpoints: 5
  save_epoch: true
lora:
  rank: 64
  alpha: 64
  dropout: 0.0
  targets: [q, k, v, o, ffn_up_gate, ffn_down]
  text_projection: false
  final_linear: false
logging:
  log_every: 20
  save_every: 3000
  sample_every: 3000
  sample_steps: 30
  sample_cfg: 3.0
  sample_skip_layer: 22
  sample_negative_prompt: "nsfw, worst quality, bad anatomy, watermark, jpeg artifact"
  sample_val_ids: [item_00000, item_03000, item_06000, item_09000,
                   item_12000, item_15000, item_18000, item_20000]
  comfy_export: true
  comfy_export_checkpoints: false
